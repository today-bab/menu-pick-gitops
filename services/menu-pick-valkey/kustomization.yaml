apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 네임스페이스는 services/menu-pick-backend가 만든다
namespace: menu-pick
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  # 지표 수집과 경고 규칙 (platform/monitoring의 Prometheus가 읽음)
  - servicemonitor.yaml
  - prometheusrule.yaml
