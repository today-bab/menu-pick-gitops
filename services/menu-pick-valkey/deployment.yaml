# 백엔드 Pod들이 함께 쓰는 캐시 (Redis 호환 Valkey).
# 캐시 전용이라 디스크에 저장하지 않는다. 재시작하면 비지만 백엔드가 카카오에서 다시 채운다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-pick-valkey
spec:
  replicas: 1
  # 저장하지 않으므로 새 Pod를 먼저 띄울 필요 없이 바로 바꾼다
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: menu-pick-valkey
  template:
    metadata:
      labels:
        app: menu-pick-valkey
    spec:
      securityContext:
        runAsNonRoot: true
        # 공식 이미지의 valkey 사용자
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine
          args:
            - valkey-server
            # RDB·AOF 저장을 끈다
            - --save
            - ""
            - --appendonly
            - "no"
            # 메모리가 차면 가장 오래 안 쓴 키부터 지운다 (limits보다 작게 둔다).
            # 칸 하나에 최대 405곳(약 70KB)이라 128MB면 칸 1,500개 이상을 담는다
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: [valkey-cli, ping]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 160Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # 이미지의 작업 디렉터리. 저장은 꺼져 있지만 읽기 전용 루트에서 쓸 수 있게 둔다
            - name: data
              mountPath: /data
        # Valkey 지표(메모리·키 수·쫓겨난 키 등)를 Prometheus 형식으로 연다 (Redis 호환이라 그대로 쓴다)
        - name: exporter
          image: oliver006/redis_exporter:v1.93.0
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
          ports:
            - name: metrics
              containerPort: 9121
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          emptyDir: {}
