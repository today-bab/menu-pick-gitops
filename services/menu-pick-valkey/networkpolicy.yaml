# 비밀번호 없이 쓰는 대신, 백엔드 Pod만 Valkey에 접속할 수 있게 막는다
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: menu-pick-valkey
spec:
  podSelector:
    matchLabels:
      app: menu-pick-valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: menu-pick-backend
      ports:
        - port: valkey
    # 지표 포트는 monitoring 네임스페이스의 Prometheus만 수집할 수 있다
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: metrics
