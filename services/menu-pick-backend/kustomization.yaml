apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: menu-pick
resources:
  - namespace.yaml
  # KAKAO_REST_KEY. 다시 만들 때:
  #   kubectl create secret generic menu-pick-backend -n menu-pick --from-literal=KAKAO_REST_KEY=... --dry-run=client -o yaml \
  #     | kubeseal --controller-namespace kube-system --controller-name sealed-secrets-controller --format yaml > sealed-secret.yaml
  - sealed-secret.yaml
  - deployment.yaml
  - service.yaml
  # 지표 수집과 경고 규칙 (platform/monitoring의 Prometheus가 읽음)
  - servicemonitor.yaml
  - prometheusrule.yaml
images:
  # 백엔드 CI가 main에 push될 때마다 이 태그를 커밋 SHA로 갱신한다
  - name: ghcr.io/today-bab/menu-pick-backend
    newTag: c335d4ea31c787ade4a95a30b98e21fee393b799
