apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-pick-backend
spec:
  # 한 Pod가 재시작되거나 배포 중이어도 요청을 받도록 두 개를 띄운다.
  # 캐시는 Valkey(services/menu-pick-valkey)에 있어 두 Pod가 함께 쓴다
  replicas: 2
  selector:
    matchLabels:
      app: menu-pick-backend
  template:
    metadata:
      labels:
        app: menu-pick-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: menu-pick-backend
          # 태그는 kustomization.yaml의 images에서 정한다 (CI가 갱신)
          image: ghcr.io/today-bab/menu-pick-backend
          ports:
            - name: http
              containerPort: 8080
            # 헬스 체크·Prometheus 지표 (터널로 공개하지 않음)
            - name: management
              containerPort: 8081
          env:
            - name: KAKAO_REST_KEY
              valueFrom:
                secretKeyRef:
                  name: menu-pick-backend
                  key: KAKAO_REST_KEY
            # API를 호출할 수 있는 프론트엔드 주소 (Vercel)
            - name: CORS_ALLOWED_ORIGINS
              value: https://menu.todaybab.com
            # 근처 음식점 캐시 (Valkey). 죽어도 백엔드는 캐시 없이 카카오를 부른다
            - name: SPRING_DATA_REDIS_HOST
              value: menu-pick-valkey
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # 읽기 전용 루트에서 Tomcat·JVM 임시 파일용
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
