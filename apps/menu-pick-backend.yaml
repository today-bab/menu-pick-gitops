apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: menu-pick-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/today-bab/menu-pick-gitops.git
    targetRevision: main
    path: services/menu-pick-backend
  destination:
    server: https://kubernetes.default.svc
    namespace: menu-pick
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
