apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/today-bab/menu-pick-gitops.git
    targetRevision: main
    path: platform/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # 컨트롤러를 지우면 암호화 키도 함께 사라져 기존 SealedSecret을 풀 수 없으므로 prune하지 않는다
      prune: false
      selfHeal: true
