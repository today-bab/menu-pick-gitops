apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudflared

resources:
  - namespace.yaml
  # 터널 토큰 (Cloudflare Zero Trust > Networks > Tunnels > k8s-lab). 다시 만들 때:
