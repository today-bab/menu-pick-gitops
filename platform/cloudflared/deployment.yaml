# Cloudflare Tunnel 커넥터. 클러스터 안에서 Cloudflare로 바깥 방향 연결만 열고,
# 공개 주소 → Service 연결(예: api.도메인 → menu-pick-backend.menu-pick.svc)은 Cloudflare 대시보드에서 관리한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  # 한 Pod가 재시작돼도 끊기지 않게 두 개를 띄운다
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              # Cloudflare와 연결이 하나라도 살아 있으면 200
              path: /ready
              port: metrics
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
