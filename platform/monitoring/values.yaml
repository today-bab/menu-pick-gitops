# kube-prometheus-stack values (차트 버전은 apps/monitoring.yaml)
# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

# kubeadm은 이 구성요소들의 지표를 노드의 127.0.0.1에만 열어 Prometheus가 닿지 못한다.
# 켜 두면 수집 실패 경고만 계속 나므로 수집과 관련 규칙을 끈다.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    # 다른 네임스페이스(menu-pick 등)의 ServiceMonitor·PrometheusRule도 Helm 라벨 없이 찾는다
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1536Mi
    # 기본 StorageClass(nfs-csi). 재시작해도 7일치 지표를 유지한다
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  config:
    route:
      receiver: discord
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      # 해결되지 않은 경고는 12시간마다 다시 알린다
      repeat_interval: 12h
      routes:
        # Watchdog은 알림 파이프라인이 살아 있음을 보이려고 항상 울리는 경고, InfoInhibitor는 억제용이라 보내지 않는다
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        - receiver: "null"
          matchers:
            - severity =~ "none|info"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true
  alertmanagerSpec:
    # platform/monitoring/resources의 SealedSecret이 만드는 Secret을 마운트한다
    secrets:
      - alertmanager-discord
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

grafana:
  # 대시보드는 ConfigMap(코드)으로 관리하므로 디스크에 저장하지 않는다
  persistence:
    enabled: false
  defaultDashboardsTimezone: Asia/Seoul
  # 관리자 비밀번호는 차트가 무작위로 만들어 Secret(kube-prometheus-stack-grafana)에 둔다
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # ConfigMap 대시보드의 grafana_folder 주석을 Grafana 폴더로 쓴다 (platform/monitoring/resources)
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  # grafana.com 공개 대시보드 (Grafana가 시작할 때 내려받는다)
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: spring
          folder: Spring Boot
          type: file
          options:
            path: /var/lib/grafana/dashboards/spring
  dashboards:
    spring:
      jvm-micrometer:
        gnetId: 4701
        revision: 10
        datasource: Prometheus
      spring-boot-statistics:
        gnetId: 19004
        revision: 1
        datasource: Prometheus
