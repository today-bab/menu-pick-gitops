# 차트 밖에서 monitoring 네임스페이스에 함께 배포하는 리소스
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  # Discord 웹훅 URL (Alertmanager가 /etc/alertmanager/secrets/alertmanager-discord/webhook-url로 읽음). 다시 만들 때:
  #   kubectl create secret generic alertmanager-discord -n monitoring --from-literal=webhook-url=https://discord.com/api/webhooks/... --dry-run=client -o yaml \
  #     | kubeseal --controller-namespace kube-system --controller-name sealed-secrets-controller --format yaml > alertmanager-discord.sealed-secret.yaml
  - alertmanager-discord.sealed-secret.yaml

# Grafana 사이드카가 grafana_dashboard 라벨이 붙은 ConfigMap을 대시보드로 불러온다
configMapGenerator:
  - name: grafana-dashboard-menu-pick
    files:
      - dashboards/menu-pick.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        # Grafana에서 menu-pick 폴더에 넣는다
        grafana_folder: menu-pick
