name: 장애
description: 배포·클러스터·모니터링이 기대와 다르게 동작하는 문제
title: '[Fix] '
labels: [bug]
body:
  - type: textarea
    id: actual
    attributes:
      label: 현상
      description: 무엇이 잘못 동작하나. 경고·이벤트·로그가 있으면 붙인다
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 다시 일으키는 순서나 확인한 명령
      placeholder: |
        1. kubectl -n menu-pick get pods
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
